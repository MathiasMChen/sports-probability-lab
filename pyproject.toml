[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-probability-lab"
version = "0.1.0"
description = "Reproducible reference models for sports probability research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]
authors = [{name = "Muhuan (Mathias) Chen"}]

[tool.setuptools.packages.find]
where = ["src"]
